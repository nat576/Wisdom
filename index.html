nav {

#today { color: var(--accent); font-weight: 600; font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; }

const TRADITIONS = ["Christianity", "Buddhism", "Hinduism", "Stoicism"];
let offset = 0;

function dayOfYear(d) {
  const start = new Date(d.getFullYear(), 0, 1);
  const day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.round((day - start) / 86400000) + 1;
}

function render(animate) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  const n = dayOfYear(d);
  const i = Math.min(n, QUOTES.length) - 1;
  const [text, source] = QUOTES[i];
  const t = i % 4;

  const apply = () => {
    document.getElementById("date").textContent =
      d.toLocaleDateString("en-CA", { weekday: "long", month: "long", day: "numeric" });
    document.getElementById("dayno").textContent = "Day " + n;
    document.querySelectorAll("#cycle li").forEach((li, k) => {
      li.classList.toggle("on", k === t);
      if (k === t) li.setAttribute("aria-current", "true"); else li.removeAttribute("aria-current");
    });
    const q = document.getElementById("quote");
    q.textContent = text;
    q.className = text.length < 60 ? "short" : text.length > 150 ? "long" : "";
    document.getElementById("source").textContent = source;
    document.getElementById("prev").textContent = offset === 0 ? "‹ Yesterday" : "‹ Previous";
    document.getElementById("next").textContent = offset === 0 ? "Tomorrow ›" : "Next ›";
    document.getElementById("today").setAttribute("aria-hidden", offset === 0 ? "true" : "false");
    document.title = "Daily Wisdom";
  };

  const fig = document.getElementById("fig");
  const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!animate || still) { apply(); return; }
  fig.classList.add("fade");
  setTimeout(() => { apply(); fig.classList.remove("fade"); }, 200);
}

function step(by) { offset += by; render(true); }
document.getElementById("prev").addEventListener("click", () => step(-1));
document.getElementById("next").addEventListener("click", () => step(1));
document.getElementById("today").addEventListener("click", () => { offset = 0; render(true); });
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

let sx = null, sy = null;
document.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
document.addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1);
  sx = sy = null;
}, { passive: true });

// When the app comes back to the front on a new day, show that day's quote.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { offset = 0; render(false); }
});

render(false);
</script>
